name: pulse
description: "Pulse — a Bengali-first real-time messaging app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  dartz: ^0.10.1

  # Firebase (Auth removed - Supabase Auth Migration. Firestore/FCM remain
  # for the not-yet-migrated Chat/Group/Friends repositories. cloud_functions
  # removed — Admin & Moderation was its last consumer
  # (CloudFunctionAdminSecurityGateway, deleted).
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Supabase (Auth + Database + Realtime, replacing Firestore feature by
  # feature - see supabase/README_PHASE1.md and the Phase 2 migration notes)
  supabase_flutter: ^2.6.0
  uuid: ^4.4.2

  # Notifications
  flutter_local_notifications: ^17.2.3

  # MILESTONE 2 (Friend Alert Push Download & Auto Play): the only reliable
  # way to keep the process alive long enough to download+verify+autoplay a
  # Friend Alert sound when a push arrives in background/terminated state.
  # Used behind exactly one wrapper — lib/core/services/
  # alert_foreground_service_bridge.dart — so no other file in the app
  # depends on this package directly.
  flutter_foreground_task: ^8.17.0

  # Media / device
  image_picker: ^1.1.2
  record: ^5.1.2
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # BUG FIX (profile photo blink/re-download): Flutter's built-in Image.network
  # only uses the in-memory PaintingBinding.imageCache, which (a) has no disk
  # persistence — nothing survives an app restart or a memory-pressure evict
  # — and (b) was being wiped wholesale by MediaCacheManager.forceFlushImageMemory()
  # (an existing, intentional OOM-prevention fix for heavy chat media) every
  # time a chat screen was left or scrolled to the bottom. cached_network_image
  # adds a disk-backed cache (via flutter_cache_manager) keyed by URL, so a
  # flush of the in-memory ImageCache no longer forces a real network re-fetch
  # — the widget reloads from the on-disk cache almost instantly instead, and
  # the same disk cache also makes avatars available offline after the first
  # successful download. No changes made to the existing OOM-prevention flush
  # logic itself.
  cached_network_image: ^3.4.1

  # Networking / crypto (Cloudinary REST upload; audio-cache checksum
  # verification). Cloudinary destroy signing now happens server-side in a
  # Cloud Function — see functions/src/deleteCloudinaryMedia.ts.
  http: ^1.2.2
  crypto: ^3.0.5

  # Local disk cache for friend profile fields (name/bio/username/online
  # status/lastSeen) so the chat header can render instantly from disk
  # instead of waiting on a Firestore round-trip every time a chat opens.
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8

  # Call module (Phase 1 §6): Agora RTC SDK. Imported in exactly one file,
  # lib/features/call/data/datasources/agora_datasource_impl.dart — no
  # other file in the project depends on this package directly. Version
  # could not be verified against pub.dev from this environment (no network
  # egress); confirm this resolves cleanly with `flutter pub get` and bump
  # if a newer stable release exists before this milestone is merged.
  agora_rtc_engine: ^6.5.2

  # Call module (Milestone 5): runtime microphone/camera permission
  # requests before joining an Agora channel. android/app's manifest
  # already declares RECORD_AUDIO/CAMERA statically, but Android 6+
  # (minSdk 23 here) still requires the dangerous-permission runtime
  # prompt at call time — without it, engine.enableAudio()/enableVideo()
  # silently capture nothing rather than throwing. Used behind exactly
  # one call site — CallCubit._ensureCallPermissions — no other file
  # depends on this package directly.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# record_linux 0.7.2 (the version pub resolves by default under record ^5.1.2)
# does not implement the newer record_platform_interface API and fails to
# compile ("RecordLinux missing implementations for startStream"). This pins
# record_linux to 1.3.1, which targets record_platform_interface ^1.5.0 —
# compatible with the 1.6.0 that's otherwise resolved. record_linux is the
# Linux-desktop backend only; it is never invoked on Android, this just lets
# it compile. No other dependency touched.
dependency_overrides:
  record_linux: ^1.3.1
